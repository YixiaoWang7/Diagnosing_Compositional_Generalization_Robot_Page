<!DOCTYPE html>
<html lang="en">
<head>

</head>
<body>

<div class="legend">
  <div class="legend-item"><div class="legend-swatch" style="background:#2E7D32"></div> In-distribution (ID)</div>

  <div class="chart-panel">
